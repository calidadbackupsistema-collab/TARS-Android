name: Compilar TARS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APKs (celular y reloj)
        run: gradle --no-daemon --stacktrace :app:assembleRelease :wear:assembleRelease

      - name: Preparar archivos
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/tars-phone.apk
          cp wear/build/outputs/apk/release/wear-release.apk out/tars-wear.apk
          cp tools/instalar_reloj.bat out/instalar_reloj.bat

      - uses: actions/upload-artifact@v4
        with:
          name: tars-apks
          path: out/

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: TARS 1.0.${{ github.run_number }}
          make_latest: true
          files: |
            out/tars-phone.apk
            out/tars-wear.apk
            out/instalar_reloj.bat
          body: |
            **Celular:** descarga `tars-phone.apk` en tu Samsung e instálalo (acepta "instalar apps desconocidas" la primera vez).
            **Reloj:** descarga `instalar_reloj.bat` en tu PC con Windows y ábrelo; te guía para instalar `tars-wear.apk` en el Galaxy Watch por depuración inalámbrica.
